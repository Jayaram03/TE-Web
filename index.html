<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <script>
    // Resolve before CSS/React renders; storage may be unavailable in private browsing.
    (() => {
      const hour = new Date().getHours();
      let theme = hour >= 6 && hour < 18 ? 'day' : 'night';
      try {
        const saved = localStorage.getItem('te-theme');
        if (saved === 'day' || saved === 'night') theme = saved;
      } catch { /* Use local time when storage is blocked. */ }
      document.documentElement.dataset.theme = theme;
      document.documentElement.style.colorScheme = theme === 'night' ? 'dark' : 'light';
    })();
  </script>
  <link rel="icon" type="image/png" sizes="128x128" href="/favicon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Travel Episodes</title>
  <meta name="description"
    content="Travel Episodes — curated domestic & international travel packages. Craft your story with trusted, secure and 24/7 supported trip planning." />

  <!-- Performance: speed up the connection to the hero/background image CDN -->
  <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
  <link rel="dns-prefetch" href="https://images.unsplash.com" />

</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
